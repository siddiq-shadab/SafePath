<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SafePath - Live Map</title>


    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- SafePath common styles -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- Live Map styles -->
    <link
        rel="stylesheet"
        href="../css/livemap.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION OVERLAY
    ====================================================== -->

    <div
        id="navigationOverlay"
        class="navigation-overlay"
    ></div>


    <!-- =====================================================
         NAVIGATION DRAWER
    ====================================================== -->

    <aside
        id="navigationDrawer"
        class="navigation-drawer"
        aria-hidden="true"
    >

        <div class="drawer-header">

            <div class="drawer-title">

                <strong>SafePath</strong>

                <span>
                    Fleet Control
                </span>

            </div>


            <button
                id="drawerClose"
                class="drawer-close"
                type="button"
                aria-label="Close navigation"
            >
                ×
            </button>

        </div>


        <nav class="drawer-navigation">

            <a href="Overview.html">
                Overview
            </a>

            <a href="vehicles.html">
                Vehicles
            </a>

            <a
                href="livemap.html"
                class="active"
            >
                Live Map
            </a>

            <a href="alerts.html">
                Alerts
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="history.html">
                History
            </a>
<a href="fine.html">
    Traffic Fine
</a>

<a href="toll.html">
    Toll Tax
</a>

<a href="insurance.html">
    Insurance and Pollution
</a>
<a href="stolen.html">
  Search Stolen Vehicle
</a>

<a href="./monitor.html">
    Monitor
</a>

        </nav>

    </aside>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="page-header">

        <div class="page-header-left">


            <!-- Hamburger -->
            <button
                id="menuButton"
                class="back-button"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
            >
                ☰
            </button>


            <div class="page-title">

                <h1>
                    Live Map
                </h1>

                <span>
                    SafePath Fleet
                </span>

            </div>

        </div>


        <div class="page-header-right">


            <!-- Connection -->
            <div
                id="connectionIndicator"
                class="connection-indicator offline"
            >

                <span
                    class="connection-dot"
                ></span>

                <span
                    id="connectionText"
                >
                    Disconnected
                </span>

            </div>


            <!-- Refresh -->
            <button
                id="refreshButton"
                class="refresh-button"
                type="button"
            >
                Refresh
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <main class="live-map-page">

        <section class="map-wrapper">


            <!-- Leaflet map -->
            <div
                id="liveMap"
                class="live-map"
            ></div>


            <!-- =================================================
                 FLEET STATUS
            ================================================== -->

            <div
                id="fleetStatus"
                class="fleet-status"
            >

                <div class="fleet-status-title">
                    Online Fleet
                </div>

                <div
                    id="fleetVehicleCount"
                    class="fleet-vehicle-count"
                >
                    0 vehicles
                </div>

            </div>


            <!-- =================================================
                 VEHICLE LEGEND
            ================================================== -->

            <div class="map-legend">

                <div class="map-legend-title">
                    Vehicles
                </div>


                <div class="map-legend-item">

                    <span
                        class="legend-marker car"
                    ></span>

                    Car

                </div>


                <div class="map-legend-item">

                    <span
                        class="legend-marker vip"
                    ></span>

                    VIP

                </div>


                <div class="map-legend-item">

                    <span
                        class="legend-marker police"
                    ></span>

                    Police

                </div>


                <div class="map-legend-item">

                    <span
                        class="legend-marker fire-engine"
                    ></span>

                    Fire Engine

                </div>


                <div class="map-legend-item">

                    <span
                        class="legend-marker ambulance"
                    ></span>

                    Ambulance

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         SOCKET.IO
    ====================================================== -->

    <script
        src="../js/socket.io.min.js"
    ></script>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         SAFEPATH SOCKET CLIENT
    ====================================================== -->

    <script
        src="../js/websocket.js"
    ></script>


    <!-- =====================================================
         LIVE MAP APPLICATION
    ====================================================== -->

    <script
        src="../js/livemap.js"
    ></script>


</body>

</html>
